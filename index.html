<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Online - KTLM</title>
  
  <!-- File CSS Utama -->
  <link rel="stylesheet" href="index.css">
  
  <!-- Override Warna Khusus Katalog -->
  <style>
    .app-header {
      background: #0284c7 !important; /* Biru Laut */
    }
    .cat-btn.active {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
    }
    .btn-checkout {
      background: #0284c7 !important;
    }
    .modal-header {
      background: #0284c7 !important;
    }
    #subCategoryModal .btn-confirm-pay {
      background: #0284c7 !important;
    }
    /* Override Tombol - + Kapsul agar berwarna Biru Katalog */
    .qty-badge-inline {
      border-color: #0284c7 !important;
      background: #f0f9ff !important;
    }
    .btn-qty-card, .btn-qty-mini, .btn-counter-mini, .btn-qty-action {
      background: #0284c7 !important;
    }
    .btn-qty-card:active, .btn-qty-mini:active, .btn-counter-mini:active, .btn-qty-action:active {
      background-color: #0369a1 !important;
    }
    .qty-input-inline, .counter-val {
      color: #0369a1 !important;
    }
  </style>
</head>
<body>

  <!-- Header Katalog -->
  <header class="app-header">
    <h1 id="storeTitleHeader">Katalog Menu KTLM</h1>
    <span style="font-size: 12px; color: #e0f2fe;">Pesan Online</span>
  </header>

  <!-- Container Utama -->
  <div class="main-container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari menu favorit..." oninput="filterProducts()">

    <div class="category-bar" id="categoryBar">
      <button class="cat-btn active" onclick="filterCategory('ALL', this)">Semua</button>
    </div>

    <!-- Grid Produk -->
    <div class="product-grid" id="productGrid">
      <p style="grid-column: span 2; text-align: center; color: #6c757d; padding: 20px;">Memuat menu...</p>
    </div>
  </div>

  <!-- Bottom Bar Pesanan -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span class="bottom-bar-items" id="barItemCount">0 Item</span>
      <span class="bottom-bar-total" id="barTotalAmount">Rp0</span>
    </div>
    <button class="btn-checkout" id="btnOpenCheckout" onclick="openCheckoutModal()" disabled>
      Lanjutkan Order →
    </button>
  </div>

  <!-- Modal Pilih Variasi / Subkategori -->
  <div class="modal-overlay" id="subCategoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="subModalTitle">Pilih Variasi</span>
        <button class="btn-close" onclick="closeSubModal()">&times;</button>
      </div>
      <div class="modal-body" id="subModalBody"></div>
      <div class="modal-footer">
        <button class="btn-confirm-pay" onclick="confirmSubCategorySelection()">+ TAMBAHKAN KE KERANJANG</button>
      </div>
    </div>
  </div>

  <!-- Modal Form Order Pelanggan -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Form Pemesanan</span>
        <button class="btn-close" onclick="closeCheckoutModal()">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- Rincian Items -->
        <div class="form-group">
          <label style="font-weight: bold; color: #0284c7; margin-bottom: 8px; display: block;">RINCIAN PESANAN</label>
          <div id="modalCartList"></div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">

        <!-- Nama Pemesan -->
        <div class="form-group">
          <label for="custNameInput">NAMA PEMESAN *</label>
          <input type="text" id="custNameInput" class="form-input" placeholder="Masukkan nama Anda..." required>
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-group">
          <label for="paymentMethodSelect">METODE PEMBAYARAN</label>
          <select id="paymentMethodSelect" class="form-select">
            <option value="Tunai">Tunai / COD</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <!-- Alamat / Catatan -->
        <div class="form-group">
          <label for="orderNote">ALAMAT / CATATAN KHUSUS</label>
          <textarea id="orderNote" class="form-textarea" placeholder="Contoh: Kirim ke Jl. Melati No 12, Pedas..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <div class="summary-line">
          <span>TOTAL:</span>
          <span id="modalTotalAmount">Rp0</span>
        </div>
        <button class="btn-confirm-pay" id="btnSubmitOrder" onclick="submitCatalogOrder()" style="background: #25D366; color: white;">
          📲 KIRIM ORDER VIA WHATSAPP
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Detail Produk -->
  <div class="modal-overlay" id="productDetailModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="detailModalTitle">Detail Menu</span>
        <button class="btn-close" onclick="closeProductDetailModal()">&times;</button>
      </div>
      
      <div class="modal-body" style="text-align: center;">
        <img id="detailModalImg" src="" alt="Gambar Menu" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;">
        
        <!-- 1. NAMA MENU -->
        <h3 id="detailModalName" style="margin: 0 0 4px 0; color: #0f172a;"></h3>
        
        <!-- 2. KETERANGAN BARU (Diambil dari Kolom F) -->
        <p id="detailModalDesc" style="color: #64748b; font-size: 13px; margin: 0 0 10px 0; line-height: 1.4;"></p>
        <p id="detailModalDesc" style="text-align: center; font-size: 14px; color: #4a5568; margin: 10px 0; line-height: 1.4;"></p>
        
        <!-- 3. HARGA -->
        <p id="detailModalPrice" style="font-weight: bold; color: #0284c7; font-size: 16px; margin-bottom: 15px;"></p>

        <div class="form-group" style="text-align: left;">
          <label for="detailModalNote" style="font-size: 12px; font-weight: bold; color: #64748b;">CATATAN UNTUK MENU INI</label>
          <input type="text" id="detailModalNote" class="form-input" placeholder="Contoh: Pedas, Tanpa Bawang...">
        </div>

        <!-- INPUT QTY BISA DIEDIT MANUAL -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px;">
          <button class="btn-qty-action" onclick="changeDetailModalQty(-1)" style="width: 36px; height: 36px; border-radius: 6px; border: none; color: white; font-weight: bold; font-size: 18px; cursor: pointer;">-</button>
          <input type="number" id="detailModalQty" value="1" min="1" style="width: 65px; height: 36px; text-align: center; font-size: 16px; font-weight: bold; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
          <button class="btn-qty-action" onclick="changeDetailModalQty(1)" style="width: 36px; height: 36px; border-radius: 6px; border: none; color: white; font-weight: bold; font-size: 18px; cursor: pointer;">+</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-confirm-pay" onclick="saveDetailModalCart()" style="background: #0284c7;">
          + SIMPAN KE KERANJANG
        </button>
      </div>
    </div>
  </div>
  
  <!-- Terhubung ke logika Javascript Katalog -->
  <script src="index.js?v=2"></script>

</body>
</html>
