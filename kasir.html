<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir POS - KTLM Kitchen</title>
  <link rel="stylesheet" href="kasir.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>KTLM Kitchen</h1>
    <div class="header-actions">
      <button class="btn-pending-orders" onclick="openPendingOrdersModal()" style="background:none; border:none; color:#fff;">
        📦 Pesanan <span id="orderBadge" class="badge" style="display:none;">0</span>
      </button>
      <button class="btn-settings" onclick="openSettingsModal()" style="background:none; border:none; color:#fff; font-size:18px;">⚙️</button>
    </div>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="main-container">
    <input type="text" id="searchInput" class="search-box" placeholder="Cari menu favorit..." oninput="filterProducts()">

    <div id="categoryBar" class="category-bar"></div>

    <div id="productGrid" class="product-grid"></div>
  </main>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span id="totalItemsText" class="bottom-bar-items">0 Item</span>
      <span id="totalPriceText" class="bottom-bar-total">Rp0</span>
    </div>
    <button id="btnCheckout" class="btn-checkout" onclick="openCheckoutModal()" disabled>Lanjutkan Order &rarr;</button>
  </div>


  <!-- MODAL DETAIL MENU (POPUP BUBBLE - GAMBAR 3) -->
  <div id="detail-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-header-title" class="modal-title">Detail Menu</span>
        <button class="btn-close" onclick="closeDetailModal()">&times;</button>
      </div>

      <div class="modal-body text-center">
        <img id="modal-img" src="" alt="Foto Produk" class="modal-product-img">
        <h3 id="modal-title" class="modal-product-name">-</h3>
        <p id="modal-desc" class="modal-product-desc">-</p>
        <p id="modal-price" class="modal-product-price">Rp0</p>

        <!-- Input Catatan Menu -->
        <div class="modal-field">
          <label for="modal-notes">CATATAN UNTUK MENU INI</label>
          <input type="text" id="modal-notes" class="form-input" placeholder="Contoh: Pedas, Tanpa Bawang...">
        </div>

        <!-- Tombol Qty (- [ 1 ] +) -->
        <div class="qty-control-modal">
          <button class="btn-modal-qty" onclick="changeModalQty(-1)">-</button>
          <div id="modal-qty-val" class="modal-qty-box">1</div>
          <button class="btn-modal-qty" onclick="changeModalQty(1)">+</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-save-cart-red" onclick="saveModalToCart()">+ SIMPAN KE KERANJANG</button>
      </div>
    </div>
  </div>


  <!-- MODAL KERANJANG & PEMBAYARAN -->
  <div id="cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Rincian Pesanan</span>
        <button class="btn-close" onclick="closeCheckoutModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div id="cartItemList"></div>
        <hr style="margin: 16px 0; border: none; border-top: 1px dashed #ced4da;">

        <div class="modal-field">
          <label for="customerSelect">PELANGGAN</label>
          <select id="customerSelect" class="form-select">
            <option value="Umum">Umum / Walk-in</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="paymentMethod">METODE PEMBAYARAN</label>
          <select id="paymentMethod" class="form-select">
            <option value="Tunai">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <div id="cashInputContainer" class="modal-field">
          <label for="cashPaidInput">UANG DITERIMA (RP)</label>
          <input type="number" id="cashPaidInput" class="form-input" placeholder="0" oninput="calculateChange()">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-save-cart-red" style="background:#0088cc;" onclick="processPayment()">BAYAR & PRINT STRUK</button>
      </div>
    </div>
  </div>

  <script src="kasir.js"></script>
</body>
</html>
