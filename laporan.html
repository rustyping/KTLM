<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penjualan - KTLM Kitchen</title>
  <style>
    :root { --primary: #1b5e20; --bg: #f8f9fa; --text: #333; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 22px; }
    
    .filter-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; }
    
    .filter-row { display: flex; gap: 15px; flex-wrap: wrap; }
    
    .form-group { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
    .form-group label { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; }
    .form-group input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .btn-filter { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-filter:hover { background: #2e7d32; }

    /* Desain Kotak Centang Multi-Select */
    .dropdown-check-list { position: relative; width: 100%; }
    .dropdown-check-list .anchor { cursor: pointer; display: block; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 14px; position: relative; font-weight:bold; color:#1b5e20; }
    .dropdown-check-list .anchor:after { content: '▼'; position: absolute; right: 12px; top: 12px; font-size: 12px; color: #666; }
    .dropdown-check-list ul.items { padding: 12px; display: none; position: absolute; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-height: 250px; overflow-y: auto; z-index: 100; margin: 5px 0 0 0; list-style: none; box-sizing: border-box; }
    .dropdown-check-list ul.items li { margin-bottom: 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .dropdown-check-list ul.items li:last-child { margin-bottom: 0; }
    .dropdown-check-list ul.items input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }

    /* FITUR BARU: Toggle Kolom */
    .toggle-kolom { background: white; padding: 12px 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .toggle-kolom label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #333; font-weight: 600;}
    .toggle-kolom input { cursor: pointer; transform: scale(1.2); }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .summary-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .summary-card h3 { margin: 0 0 8px 0; font-size: 12px; color: #6c757d; text-transform: uppercase; }
    .summary-card .value { font-size: 20px; font-weight: 900; color: var(--primary); }
    .value.profit { color: #1976d2; }
    
    .table-container { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; } 
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 12px; }
    th { background: #e8f5e9; color: var(--primary); font-weight: bold; white-space: nowrap; }
    tr:hover { background-color: #f1f8e9; }
    
    /* CSS Sembunyikan Kolom Dinamis */
    table.hide-invoice .col-invoice { display: none; }
    table.hide-customer .col-customer { display: none; }
    table.hide-detail .col-detail { display: none; }
    table.hide-pembayaran .col-pembayaran { display: none; }

    #loadingMsg { text-align: center; padding: 30px; font-weight: bold; color: #666; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Rekap Penjualan KTLM</h1>
    <p style="margin:0; color:#666; font-size:13px;">Ringkasan Omset & Keuntungan</p>
  </div>

  <!-- Filter Tertata Rapi Sesuai Permintaan -->
  <div class="filter-card">
    
    <!-- Baris 1: Dari tanggal - Sampai tanggal -->
    <div class="filter-row">
      <div class="form-group">
        <label>Dari Tanggal:</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label>Sampai Tanggal:</label>
        <input type="date" id="endDate">
      </div>
    </div>

<!-- Baris 2: Bulan Lalu - Bulan Ini -->
    <div class="filter-row">
      <button class="btn-filter" style="background:#17a2b8;" onclick="setLastMonth()">Bulan Lalu</button>
      <button class="btn-filter" style="background:#6c757d;" onclick="setThisMonth()">Bulan Ini</button>
    </div>

    <!-- Baris 3: Filter Pelanggan -->
    <div class="form-group">
      <label>Filter Pelanggan:</label>
      <div class="dropdown-check-list" id="listCustomer">
        <span class="anchor" onclick="toggleCustomerList()">✅ Semua Pelanggan</span>
        <ul class="items" id="customerCheckboxes">
          <!-- Dimuat otomatis -->
        </ul>
      </div>
    </div>
    
    <!-- Baris 4: Tampilkan Data -->
    <button class="btn-filter" style="padding: 12px; font-size: 16px;" onclick="applyFilter()">Tampilkan Data</button>

  </div>

  <!-- Kartu Ringkasan -->
  <div class="summary-grid">
    <div class="summary-card">
      <h3>Total Transaksi</h3>
      <div class="value" id="sumTrx">0</div>
    </div>
    <div class="summary-card">
      <h3>Total Pendapatan</h3>
      <div class="value" id="sumOmset">Rp0</div>
    </div>
    <div class="summary-card">
      <h3>Total Modal (HPP)</h3>
      <div class="value" style="color:#d32f2f;" id="sumHpp">Rp0</div>
    </div>
    <div class="summary-card">
      <h3>Laba Bersih</h3>
      <div class="value profit" id="sumLaba">Rp0</div>
    </div>
  </div>

<!-- Pengaturan Tampilan Kolom (Cocok untuk HP) -->
  <div class="toggle-kolom">
    <strong style="color:#666; margin-right:5px;">Tampilkan Kolom:</strong>
    <label><input type="checkbox" id="chkInvoice" onchange="toggleTableColumns()"> No Invoice</label>
    
    <label><input type="checkbox" id="chkCustomer" checked onchange="toggleTableColumns()"> Customer</label>
    <label><input type="checkbox" id="chkDetail" checked onchange="toggleTableColumns()"> Detail Pesanan</label>

    <label><input type="checkbox" id="chkPembayaran" onchange="toggleTableColumns()"> Pembayaran</label>
  </div>

  <!-- Tabel Data -->
  <div class="table-container">
    <div id="loadingMsg">Memuat data dari database...</div>
    <table id="laporanTable" style="display: none;">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th class="col-invoice">No Invoice</th>
          <th class="col-customer">Customer</th>
          <th class="col-detail">Detail Pesanan</th>
          <th class="col-pembayaran">Pembayaran</th>
          <th>Omset</th>
        </tr>
      </thead>
      <tbody id="laporanBody"></tbody>
    </table>
  </div>

  <!-- Pastikan versi JS-nya naik agar browser membersihkan cache -->
  <script src="laporan.js?v=8"></script>
</body>
</html>
