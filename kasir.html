<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir POS - Toko Damai</title>
  <link rel="stylesheet" href="kasir.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>KTLM Kitchen</h1>
    <div class="header-actions">
      <button class="btn-pending-orders" onclick="openPendingOrdersModal()">
        📦 Pesanan <span id="orderBadge" class="badge" style="display:none;">0</span>
      </button>
      <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
    </div>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="main-container">
    <input type="text" id="searchInput" class="search-box" placeholder="Cari menu favorit..." oninput="filterProducts()">

    <div id="categoryBar" class="category-bar">
      <!-- Diisi dinamis oleh kasir.js -->
    </div>

    <div id="productGrid" class="product-grid">
      <!-- Diisi dinamis oleh kasir.js -->
    </div>
  </main>

  <!-- BOTTOM BAR (TOTAL & CHECKOUT) -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span id="totalItemsText" class="bottom-bar-items">0 Item</span>
      <span id="totalPriceText" class="bottom-bar-total">Rp0</span>
    </div>
    <button id="btnCheckout" class="btn-checkout" onclick="openCheckoutModal()" disabled>LANJUTKAN ORDER &rarr;</button>
  </div>


  <!-- MODAL DETAIL PRODUK (GAMBAR 3) -->
  <div id="detail-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-detail-content">
      <div class="modal-header">
        <span id="modal-header-title" class="modal-title">Detail Produk</span>
        <button class="btn-close" onclick="closeDetailModal()">&times;</button>
      </div>

      <div class="modal-body text-center">
        <img id="modal-img" src="" alt="Foto Produk" class="modal-product-img">
        <h3 id="modal-title" class="modal-product-name">-</h3>
        <p id="modal-desc" class="modal-product-desc">-</p>
        <p id="modal-price" class="modal-product-price">Rp0</p>

        <!-- Input Catatan -->
        <div class="modal-field style-left">
          <label for="modal-notes" class="label-custom">CATATAN UNTUK MENU INI</label>
          <input type="text" id="modal-notes" class="form-input" placeholder="Contoh: Pedas, Tanpa Bawang...">
        </div>

        <!-- Tombol Qty - 1 + -->
        <div class="qty-control-modal">
          <button class="btn-qty-pill" onclick="changeModalQty(-1)">-</button>
          <span id="modal-qty-val" class="qty-val-display">1</span>
          <button class="btn-qty-pill" onclick="changeModalQty(1)">+</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-submit-cart" onclick="saveModalToCart()">+ SIMPAN KE KERANJANG</button>
      </div>
    </div>
  </div>


  <!-- MODAL KERANJANG & PEMBAYARAN -->
  <div id="cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Rincian Pesanan</span>
        <button class="btn-close" onclick="closeCheckoutModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div id="cartItemList"></div>

        <hr style="margin: 16px 0; border: none; border-top: 1px dashed #ced4da;">

        <div class="modal-field">
          <label for="customerSelect">PELANGGAN</label>
          <select id="customerSelect" class="form-select">
            <option value="Umum">Umum / Walk-in</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="orderNote">CATATAN PESANAN</label>
          <input type="text" id="orderNote" class="form-input" placeholder="Contoh: Bungkus...">
        </div>

        <div class="modal-field">
          <label for="paymentMethod">METODE PEMBAYARAN</label>
          <select id="paymentMethod" class="form-select">
            <option value="Tunai">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <div id="cashInputContainer" class="modal-field">
          <label for="cashPaidInput">UANG DITERIMA (RP)</label>
          <input type="number" id="cashPaidInput" class="form-input" placeholder="0" oninput="calculateChange()">
        </div>

        <div id="changeDisplayRow" class="summary-line">
          <span>Kembalian:</span>
          <span id="changeText">Rp0</span>
        </div>
      </div>

      <div class="modal-footer">
        <div class="summary-line" style="margin-bottom: 12px;">
          <span>Total Bayar</span>
          <span id="cartTotalPrice" style="font-size: 18px; font-weight: bold; color: #d32f2f;">Rp0</span>
        </div>
        <button class="btn-submit-cart" onclick="processPayment()">BAYAR & PRINT STRUK</button>
      </div>
    </div>
  </div>

  <!-- MODAL PESANAN PENDING & SETTINGS -->
  <div id="pendingOrdersModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pesanan Katalog (Pending)</span>
        <button class="btn-close" onclick="closePendingOrdersModal()">&times;</button>
      </div>
      <div class="modal-body"><div id="pendingOrdersList"></div></div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pengaturan Kasir</span>
        <button class="btn-close" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label><input type="checkbox" id="settingShowImages" checked> Tampilkan Gambar Produk</label>
        </div>
        <div class="modal-field">
          <label for="settingPrintMode">MODE CETAK</label>
          <select id="settingPrintMode" class="form-select">
            <option value="rawbt">RawBT Bluetooth</option>
            <option value="browser">Print Browser</option>
          </select>
        </div>
        <div class="modal-field">
          <label for="settingPaperSize">UKURAN KERTAS</label>
          <select id="settingPaperSize" class="form-select">
            <option value="58mm">Thermal 58mm</option>
            <option value="80mm">Thermal 80mm</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-submit-cart" onclick="savePrinterSettings()">SIMPAN PENGATURAN</button>
      </div>
    </div>
  </div>

  <div id="receipt-print"></div>

  <script src="kasir.js"></script>
</body>
</html>
