<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir POS - Toko Damai</title>
  <link rel="stylesheet" href="kasir.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>KTLM Kitchen</h1>
    <div class="header-actions">
      <!-- Tombol Pesanan Pending Katalog -->
      <button class="btn-pending-orders" onclick="openPendingOrdersModal()">
        📦 Pesanan <span id="orderBadge" class="badge" style="display:none;">0</span>
      </button>
      <!-- Tombol Pengaturan -->
      <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
    </div>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="main-container">
    <!-- Search Bar -->
    <input type="text" id="searchInput" class="search-box" placeholder="Cari nama produk..." oninput="filterProducts()">

    <!-- Bar Kategori -->
    <div id="categoryBar" class="category-bar">
      <!-- Diisi secara dinamis oleh kasir.js -->
    </div>

    <!-- Grid Produk -->
    <div id="productGrid" class="product-grid">
      <!-- Diisi secara dinamis oleh kasir.js -->
    </div>
  </main>

  <!-- BOTTOM BAR (TOTAL & CHECKOUT) -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span id="totalItemsText" class="bottom-bar-items">0 Item</span>
      <span id="totalPriceText" class="bottom-bar-total">Rp0</span>
    </div>
    <button id="btnCheckout" class="btn-checkout" onclick="openCheckoutModal()" disabled>Bayar</button>
  </div>

  <!-- MODAL SUB-KATEGORI / VARIASI PRODUK -->
  <div id="subCategoryModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span id="subModalTitle" class="modal-title">Pilih Variasi</span>
        <button class="btn-close" onclick="closeSubModal()">&times;</button>
      </div>
      <div id="subModalBody" class="modal-body">
        <!-- Diisi dinamis saat produk ber-variasi diklik -->
      </div>
      <div class="modal-footer">
        <button class="btn-confirm-pay" onclick="confirmSubCategorySelection()">
          TAMBAH KE KERANJANG
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL KERANJANG & PEMBAYARAN -->
  <div id="cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Rincian Pesanan</span>
        <button class="btn-close" onclick="closeCheckoutModal()">&times;</button>
      </div>

      <div class="modal-body">
        <!-- List Item Keranjang -->
        <div id="cartItemList">
          <!-- Diisi dinamis oleh kasir.js -->
        </div>

        <hr style="margin: 16px 0; border: none; border-top: 1px dashed #ced4da;">

        <!-- Pilih Pelanggan -->
        <div class="modal-field">
          <label for="customerSelect">PELANGGAN</label>
          <select id="customerSelect" class="form-select">
            <option value="Umum">Umum / Walk-in</option>
          </select>
        </div>

        <!-- Catatan Tambahan -->
        <div class="modal-field">
          <label for="orderNote">CATATAN PESANAN (OPSIONAL)</label>
          <input type="text" id="orderNote" class="form-input" placeholder="Contoh: Pedas, Tanpa Bawang...">
          <div class="quick-chips" style="margin-top: 6px;">
            <button type="button" class="chip-btn" onclick="addQuickNote('Bungkus')">+ Bungkus</button>
            <button type="button" class="chip-btn" onclick="addQuickNote('Pedas')">+ Pedas</button>
            <button type="button" class="chip-btn" onclick="addQuickNote('Pisah Kuah')">+ Pisah Kuah</button>
          </div>
        </div>

        <!-- Metode Pembayaran & Input Uang -->
        <div class="modal-field">
          <label for="paymentMethod">METODE PEMBAYARAN</label>
          <select id="paymentMethod" class="form-select">
            <option value="Tunai">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <div id="cashInputContainer" class="modal-field">
          <label for="cashPaidInput">UANG DITERIMA (RP)</label>
          <input type="number" id="cashPaidInput" class="form-input" placeholder="0" oninput="calculateChange()">
          <div class="quick-chips" style="margin-top: 6px;">
            <button type="button" class="chip-btn" onclick="document.getElementById('cashPaidInput').value=10000; calculateChange();">10k</button>
            <button type="button" class="chip-btn" onclick="document.getElementById('cashPaidInput').value=20000; calculateChange();">20k</button>
            <button type="button" class="chip-btn" onclick="document.getElementById('cashPaidInput').value=50000; calculateChange();">50k</button>
            <button type="button" class="chip-btn" onclick="document.getElementById('cashPaidInput').value=100000; calculateChange();">100k</button>
          </div>
        </div>

        <div id="changeDisplayRow" class="summary-line" style="margin-top: 12px; color: #495057;">
          <span>Kembalian:</span>
          <span id="changeText" style="font-weight: bold;">Rp0</span>
        </div>
      </div>

      <div class="modal-footer">
        <div class="summary-line" style="margin-bottom: 12px;">
          <span>Total Bayar</span>
          <span id="cartTotalPrice" style="font-size: 18px; font-weight: bold; color: #2e7d32;">Rp0</span>
        </div>
        <button class="btn-confirm-pay" onclick="processPayment()">BAYAR & PRINT STRUK</button>
      </div>
    </div>
  </div>

  <!-- MODAL PESANAN PENDING (KATALOG) -->
  <div id="pendingOrdersModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pesanan Katalog (Pending)</span>
        <button class="btn-close" onclick="closePendingOrdersModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="pendingOrdersList">
          <!-- Diisi dinamis oleh kasir.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PENGATURAN -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pengaturan Kasir & Struk</span>
        <button class="btn-close" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="settingShowImages" checked>
            <span>Tampilkan Gambar Produk</span>
          </label>
        </div>

        <div class="modal-field">
          <label for="settingPrintMode">MODE CETAK STRUK</label>
          <select id="settingPrintMode" class="form-select">
            <option value="rawbt">Aplikasi RawBT (Bluetooth Thermal)</option>
            <option value="browser">Dialog Print Browser (PDF/Kertas A4)</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="settingPaperSize">UKURAN KERTAS STRUK</label>
          <select id="settingPaperSize" class="form-select">
            <option value="58mm">Thermal 58mm</option>
            <option value="80mm">Thermal 80mm</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="settingHeaderStore">NAMA TOKO (HEADER)</label>
          <input type="text" id="settingHeaderStore" class="form-input" placeholder="Toko Damai">
        </div>

        <div class="modal-field">
          <label for="settingAddressStore">ALAMAT TOKO</label>
          <input type="text" id="settingAddressStore" class="form-input" placeholder="Malang">
        </div>

        <div class="modal-field">
          <label for="settingWaStore">NOMOR WHATSAPP</label>
          <input type="text" id="settingWaStore" class="form-input" placeholder="08123456789">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-confirm-pay" onclick="savePrinterSettings()">SIMPAN PENGATURAN</button>
      </div>
    </div>
  </div>

  <!-- TOAST REPRINT STRUK TERAKHIR -->
  <div id="toastReprint" style="display:none; position:fixed; bottom:70px; right:20px; background:#323232; color:#fff; padding:10px 16px; border-radius:30px; align-items:center; gap:10px; z-index:999; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
    <span style="font-size:12px;">Transaksi Terakhir Berhasil</span>
    <button onclick="cetakUlangStrukTerakhir()" style="background:#4caf50; color:#fff; border:none; padding:4px 10px; border-radius:15px; cursor:pointer; font-weight:bold; font-size:12px;">
      🖨️ Cetak Ulang
    </button>
    <span onclick="hideReprintToast()" style="cursor:pointer; font-weight:bold; margin-left:5px;">&times;</span>
  </div>

  <!-- AREA PRINT STRUK (HIDDEN) -->
  <div id="receipt-print"></div>

  <!-- JAVASCRIPT -->
  <script src="kasir.js"></script>
</body>
</html>
