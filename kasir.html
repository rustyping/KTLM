<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KTLM Kitchen - POS</title>
  <link rel="stylesheet" href="kasir.css">
</head>
<body>

  <!-- HEADER POS -->
  <header class="app-header">
    <h1>KTLM Kitchen</h1>
    <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="main-container">
    <!-- Search Bar -->
    <input type="text" id="searchInput" class="search-box" placeholder="Cari menu favorit..." oninput="filterProducts()">

    <!-- Category Bar -->
    <div id="categoryBar" class="category-bar">
      <button class="cat-btn active" onclick="filterCategory('ALL')">ALL</button>
      <button class="cat-btn" onclick="filterCategory('Pempek')">Pempek</button>
      <button class="cat-btn" onclick="filterCategory('Ala Carte')">Ala Carte</button>
      <button class="cat-btn" onclick="filterCategory('KTLM')">KTLM</button>
    </div>

    <!-- Product Grid Layout -->
    <div id="productGrid" class="product-grid">
      <!-- Contoh Kartu Produk Render JS -->
      <div class="product-card" onclick="openDetailModal({id: '1', name: 'Dos Keju', price: 10000, img: 'pempek.jpg', desc: 'pempek dos dengan isi keju'})">
        <div class="product-img-wrapper">
          <img src="pempek.jpg" alt="Dos Keju" class="product-img">
        </div>
        <div class="product-details">
          <div class="product-info-text">
            <div class="product-title">Dos Keju</div>
            <div class="product-price">Rp10.000</div>
          </div>
          <!-- Container Kapsul (- 1 +) -->
          <div class="qty-badge-inline" onclick="event.stopPropagation()">
            <button class="btn-qty-card" onclick="updateQty('1', -1)">-</button>
            <input type="number" class="qty-input-inline" value="1" readonly>
            <button class="btn-qty-card" onclick="updateQty('1', 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTTOM ACTION BAR -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span id="totalItemsText" class="bottom-bar-items">1 Item</span>
      <span id="totalPriceText" class="bottom-bar-total">Rp10.000</span>
    </div>
    <button id="btnCheckout" class="btn-checkout" onclick="openCheckoutModal()">Lanjutkan Order &rarr;</button>
  </div>


  <!-- MODAL DETAIL MENU (POPUP BUBBLE - GAMBAR 3) -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-header-title" class="modal-title">Dos Keju</span>
        <button class="btn-close" onclick="closeDetailModal()">&times;</button>
      </div>

      <div class="modal-body text-center">
        <img id="modal-img" src="pempek.jpg" alt="Foto Produk" class="modal-product-img">
        <h3 id="modal-title" class="modal-product-name">Dos Keju</h3>
        <p id="modal-desc" class="modal-product-desc">pempek dos dengan isi keju</p>
        <p id="modal-price" class="modal-product-price">Rp10.000</p>

        <!-- Input Catatan -->
        <div class="form-group" style="text-align: left;">
          <label for="modal-notes">CATATAN UNTUK MENU INI</label>
          <input type="text" id="modal-notes" class="form-input" placeholder="Contoh: Pedas, Tanpa Bawang...">
        </div>

        <!-- Tombol Counter (- [ 1 ] +) -->
        <div class="qty-control-modal">
          <button class="btn-modal-qty" onclick="changeModalQty(-1)">-</button>
          <div id="modal-qty-val" class="modal-qty-box">1</div>
          <button class="btn-modal-qty" onclick="changeModalQty(1)">+</button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-save-cart-red" onclick="saveModalToCart()">+ SIMPAN KE KERANJANG</button>
      </div>
    </div>
  </div>


  <!-- MODAL CHECKOUT & KERANJANG -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Rincian Pesanan</span>
        <button class="btn-close" onclick="closeCheckoutModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div id="cartItemList">
          <!-- Item keranjang di-render via JS -->
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label for="paymentMethod">METODE PEMBAYARAN</label>
          <select id="paymentMethod" class="form-select">
            <option value="Tunai">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <div class="summary-line">
          <span>Total Bayar</span>
          <span id="modalCartTotal">Rp10.000</span>
        </div>
        <button class="btn-confirm-pay" onclick="processPayment()">BAYAR & PRINT STRUK</button>
      </div>
    </div>
  </div>

  <!-- AREA PRINT STRUK THERMAL -->
  <div id="receipt-print"></div>

  <script src="kasir.js"></script>
</body>
</html>
