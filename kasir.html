<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir POS - Toko Damai</title>
  <link rel="stylesheet" href="kasir.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1>TOKO DAMAI POS</h1>
    <button class="btn-settings" onclick="openSettingsModal()">⚙️</button>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="main-container">
    <!-- Search Bar -->
    <input type="text" id="searchInput" class="search-box" placeholder="Cari nama produk..." oninput="handleSearch()">

    <!-- Bar Kategori -->
    <div id="categoryBar" class="category-bar">
      <!-- Diisi secara dinamis oleh kasir.js -->
    </div>

    <!-- Grid Produk (Diisi Dinamis oleh JS, Jangan Taruh Kartu Statis di Sini) -->
    <div id="productGrid" class="product-grid">
      <!-- Rendered by kasir.js -->
    </div>
  </main>

  <!-- BOTTOM BAR (TOTAL & CHECKOUT) -->
  <div class="bottom-bar">
    <div class="bottom-bar-info">
      <span id="totalItemsText" class="bottom-bar-items">0 Item</span>
      <span id="totalPriceText" class="bottom-bar-total">Rp0</span>
    </div>
    <button id="btnCheckout" class="btn-checkout" onclick="openCartModal()" disabled>Bayar</button>
  </div>

  <!-- MODAL DETAIL PRODUK (POPUP SAAT KARTU DIKLIK) -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Detail Produk</span>
        <button class="btn-close" onclick="closeDetailModal()">&times;</button>
      </div>

      <div class="modal-body">
        <img id="modal-img" src="" alt="Foto Produk">
        <h3 id="modal-title" style="font-size: 16px; margin-bottom: 4px;">-</h3>
        <p id="modal-price" style="font-size: 15px; font-weight: 800; color: #2e7d32; margin-bottom: 16px;">Rp0</p>

        <!-- Control Jumlah -->
        <div class="modal-field">
          <label>JUMLAH</label>
          <div class="qty-control-bottom">
            <div class="qty-badge-inline" style="padding: 4px 8px; gap: 12px;">
              <button class="btn-qty-mini" onclick="changeModalQty(-1)">-</button>
              <span id="modal-qty-val" class="counter-val" style="font-size: 16px;">1</span>
              <button class="btn-qty-mini" onclick="changeModalQty(1)">+</button>
            </div>
          </div>
        </div>

        <!-- Catatan Tambahan -->
        <div class="modal-field">
          <label for="modal-notes">CATATAN KHUSUS (OPSIONAL)</label>
          <textarea id="modal-notes" rows="2" placeholder="Contoh: Tanpa pedas, kemasan terpisah..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-confirm-pay" onclick="saveModalToCart()">Tambahkan ke Keranjang</button>
      </div>
    </div>
  </div>

  <!-- MODAL KERANJANG & PEMBAYARAN -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Rincian Pesanan</span>
        <button class="btn-close" onclick="closeCartModal()">&times;</button>
      </div>

      <div class="modal-body">
        <!-- List Item Keranjang -->
        <div id="cartItemList">
          <!-- Diisi dinamis oleh kasir.js -->
        </div>

        <hr style="margin: 16px 0; border: none; border-top: 1px dashed #ced4da;">

        <!-- Metode Pembayaran & Input Uang -->
        <div class="modal-field">
          <label for="paymentMethod">METODE PEMBAYARAN</label>
          <select id="paymentMethod" class="form-select" onchange="handlePaymentMethodChange()">
            <option value="CASH">Tunai (Cash)</option>
            <option value="QRIS">QRIS</option>
            <option value="TRANSFER">Transfer Bank</option>
          </select>
        </div>

        <div id="cashInputContainer" class="modal-field">
          <label for="cashPaidInput">UANG DITERIMA (RP)</label>
          <input type="number" id="cashPaidInput" class="form-input" placeholder="0" oninput="calculateChange()">
          <div class="quick-chips">
            <button class="chip-btn" onclick="setQuickCash(10000)">10k</button>
            <button class="chip-btn" onclick="setQuickCash(20000)">20k</button>
            <button class="chip-btn" onclick="setQuickCash(50000)">50k</button>
            <button class="chip-btn" onclick="setQuickCash(100000)">100k</button>
            <button class="chip-btn" onclick="setExactCash()">Uang Pas</button>
          </div>
        </div>

        <div id="changeDisplayRow" class="summary-line" style="margin-top: 12px; color: #495057;">
          <span>Kembalian:</span>
          <span id="changeText">Rp0</span>
        </div>
      </div>

      <div class="modal-footer">
        <div class="summary-line">
          <span>Total Bayar</span>
          <span id="cartTotalPrice">Rp0</span>
        </div>
        <button class="btn-confirm-pay" onclick="submitOrder()">Proses Transaksi</button>
      </div>
    </div>
  </div>

  <!-- MODAL PENGATURAN -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pengaturan Kasir</span>
        <button class="btn-close" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label for="printerPaperSize">UKURAN KERTAS STRUK</label>
          <select id="printerPaperSize" class="form-select">
            <option value="58mm">Thermal 58mm</option>
            <option value="80mm">Thermal 80mm</option>
          </select>
        </div>
        <button class="btn-confirm-pay" style="background: #1565c0;" onclick="syncDatabase()">🔄 Sync Ulang Database</button>
      </div>
    </div>
  </div>

  <!-- AREA PRINT STRUK THERMAL (HIDDEN IN SCREEN, VISIBLE IN PRINT) -->
  <div id="receipt-print"></div>

  <!-- JAVASCRIPT -->
  <script src="kasir.js"></script>
</body>
</html>
